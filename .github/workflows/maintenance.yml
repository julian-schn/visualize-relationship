name: Weekly maintenance

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Detect maintenance command
        id: command
        run: |
          if node -e "const p = require('./package.json'); process.exit(p.scripts?.['agent:maintenance'] ? 0 : 1)"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Maintenance tooling arrives in milestone 11."
          fi

      - name: Run maintenance
        if: steps.command.outputs.available == 'true'
        run: npm run --silent agent:maintenance -- --format json > "$RUNNER_TEMP/maintenance.json"

      - name: Inspect report
        if: steps.command.outputs.available == 'true'
        id: report
        run: |
          node -e "
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            if (!Array.isArray(report.findings)) {
              throw new Error('maintenance report must contain a findings array');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_findings=' + (report.findings.length > 0) + '\n');
          " "$RUNNER_TEMP/maintenance.json"

      - name: Open maintenance issue
        if: steps.report.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly maintenance run found items that need review."
            echo
            echo '```json'
            sed -n '1,400p' "$RUNNER_TEMP/maintenance.json"
            echo '```'
          } > "$RUNNER_TEMP/maintenance.md"

          gh issue create \
            --title "Weekly graph maintenance findings ($(date -u +%Y-%m-%d))" \
            --body-file "$RUNNER_TEMP/maintenance.md"
