name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate when available
        run: npm run validate --if-present

      - name: Test when available
        run: npm test --if-present

      - name: Build when available
        run: npm run build --if-present

      - name: Check committed build when available
        run: |
          if [ -f dist/graph.html ] && [ -n "$(git status --short -- dist/graph.html)" ]; then
            echo "dist/graph.html is stale; run npm run build and commit the result" >&2
            exit 1
          fi
