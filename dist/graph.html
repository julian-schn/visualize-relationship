}

}

.summary {

}

.note {
  margin: 0;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  color: var(--dormant);
  max-width: 46ch;
}

:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
}
</style>
</head>
